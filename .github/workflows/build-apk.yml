name: Flutter APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          cd *giri*ekran* 2>/dev/null || cd *giriş-ekranı* 2>/dev/null || cd konvoy-takip* || cd *
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: konvoy-app-release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
