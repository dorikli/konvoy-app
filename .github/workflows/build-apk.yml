name: Flutter APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          cd konvoy-takip---flutter-giriş-ekranı
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: konvoy-app-release-apk
          path: konvoy-takip---flutter-giriş-ekranı/build/app/outputs/flutter-apk/app-release.apk
